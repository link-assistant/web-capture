[package]
name = "web-capture"
version = "0.3.34"
edition = "2021"
description = "CLI and microservice to render web pages as HTML, Markdown, or PNG"
license = "Unlicense"
repository = "https://github.com/link-assistant/web-capture"
documentation = "https://docs.rs/web-capture"
readme = "README.md"
keywords = ["web", "capture", "screenshot", "markdown", "html"]
categories = ["command-line-utilities", "web-programming"]
rust-version = "1.96"

[features]
default = ["runtime"]
search = [
    "dep:html-escape",
    "dep:scraper",
    "dep:serde",
    "dep:serde_json",
    "dep:thiserror",
    "dep:url",
]
runtime = [
    "search",
    "dep:anyhow",
    "dep:async-tungstenite",
    "dep:axum",
    "dep:base64",
    "dep:browser-commander",
    "dep:clap",
    "dep:encoding_rs",
    "dep:futures",
    "dep:html-to-markdown-rs",
    "dep:html2md",
    "dep:lino-arguments",
    "dep:regex",
    "dep:reqwest",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:zip",
]

[lib]
path = "src/lib.rs"

[[bin]]
name = "web-capture"
path = "src/main.rs"
required-features = ["runtime"]

[[test]]
name = "unit"
path = "tests/unit/mod.rs"
required-features = ["runtime"]

[[test]]
name = "integration"
path = "tests/integration/mod.rs"
required-features = ["runtime"]

[[test]]
name = "search_feature"
path = "tests/search_feature.rs"
required-features = ["search"]

[dependencies]
# Browser automation using browser-commander from link-foundation
browser-commander = { version = "0.9", optional = true }
async-tungstenite = { version = "0.27", features = ["tokio-runtime"], optional = true }
futures = { version = "0.3", optional = true }

# Unified configuration from CLI args, env vars, and .lenv files
lino-arguments = { version = "0.3", optional = true }

# Async runtime
tokio = { version = "1.0", features = ["full"], optional = true }

# Web framework
axum = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["cors", "trace"], optional = true }

# HTTP client
reqwest = { version = "0.12", features = ["cookies", "gzip"], optional = true }

# HTML parsing and manipulation
scraper = { version = "0.21", optional = true }

# HTML to Markdown conversion
html2md = { version = "0.2", optional = true }
html-to-markdown-rs = { version = "3.6", features = ["inline-images", "metadata", "serde"], optional = true }

# Command line argument parsing
clap = { version = "4.5", features = ["derive", "env"], optional = true }

# Serialization
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

# Error handling
thiserror = { version = "2.0", optional = true }
anyhow = { version = "1.0", optional = true }

# Logging
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

# URL handling
url = { version = "2.5", optional = true }

# Encoding
encoding_rs = { version = "0.8", optional = true }

# Base64 for image data
base64 = { version = "0.22", optional = true }

# Regex for URL conversion
regex = { version = "1.11", optional = true }

# HTML entity decoding
html-escape = { version = "0.2", optional = true }

# ZIP archive creation
zip = { version = "4.0", default-features = false, features = ["deflate"], optional = true }

[dev-dependencies]
tokio-test = "0.4"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Allow these lints that are too strict
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
codegen-units = 1
strip = true
