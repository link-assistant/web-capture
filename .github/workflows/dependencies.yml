name: Dependency Security and Tooling

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tools:
    name: Locked release tools and npm security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - run: node scripts/setup-npm.mjs
      - run: npm ci
      - run: npm test
      - run: npm audit --package-lock-only
      - run: npm ci --prefix js
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: npm audit --prefix js --package-lock-only
      - run: node experiments/issue-174/scaffold-probe.mjs
      - run: node experiments/issue-174/scaffold-install-probe.mjs
      - run: node experiments/issue-174/fetch-buffer-probe.mjs
      - run: node experiments/issue-174/lockfile-probe.mjs

  python:
    name: Python examples and security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.23'
      - run: uv sync --locked
      - run: uv run --locked python -m unittest discover -s tests/python -v
      - run: uv run --locked pip-audit --strict

  rust-security:
    name: Rust locked dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.99.0
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --file rust/Cargo.lock --deny warnings
