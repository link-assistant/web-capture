name: Rust Checks and Release

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'Manual release mode'
        required: true
        type: choice
        default: 'instant'
        options:
          - instant
          - changelog-pr
      bump_type:
        description: 'Manual release type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      description:
        description: 'Manual release description (optional)'
        required: false
        type: string

# Concurrency: Only one workflow run per branch at a time
# - For main branch (releases): let runs finish so newer pushes do not cancel
#   an in-flight publish or release update.
# - For PR branches: cancel older runs so new pushes supersede stale checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Silences git's default-branch hint when actions/checkout runs `git init`.
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  # Generated browser protocol crates have high peak compiler memory usage.
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

defaults:
  run:
    working-directory: rust

jobs:
  dependency-health:
    name: Rust - Dependency Freshness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.99.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.node-version'
      - name: Require current direct dependencies or open blockers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ../scripts/check-dependency-freshness.mjs cargo
      - name: Require a fully updated lockfile
        shell: bash
        run: |
          cargo update --dry-run 2>&1 | tee "$RUNNER_TEMP/cargo-update.log"
          if grep -q 'Updating .* ->' "$RUNNER_TEMP/cargo-update.log"; then
            echo 'Cargo.lock has semver-compatible updates pending'
            exit 1
          fi

  # === DETECT CHANGES - determines which jobs should run ===
  detect-changes:
    name: Rust - Detect Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name != 'workflow_dispatch'
    outputs:
      rust-code-changed: ${{ steps.changes.outputs.rust-code-changed }}
      rust-changed: ${{ steps.changes.outputs.rust-changed }}
      rust-scripts-changed: ${{ steps.changes.outputs.rust-scripts-changed }}
      rust-workflow-changed: ${{ steps.changes.outputs.rust-workflow-changed }}
      any-rust-code-changed: ${{ steps.changes.outputs.any-rust-code-changed }}
      any-code-changed: ${{ steps.changes.outputs.any-code-changed }}
      docs-changed: ${{ steps.changes.outputs.docs-changed }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changes
        id: changes
        working-directory: .
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/detect-code-changes.mjs

  # === PUBLISHABLE CHANGES CHECK ===
  # Warns when PR touches publishable paths without version bump
  # This is informational — auto-release on main handles the gap
  publishable-check:
    name: Rust - Publishable Changes Check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [detect-changes]
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.any-rust-code-changed == 'true'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for publishable changes without version bump
        working-directory: .
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-publishable-changes.mjs

  # Linting and formatting - runs when Rust-relevant files change
  lint:
    name: Rust - Lint and Format Check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [detect-changes]
    if: |
      always() && !cancelled() && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        needs.detect-changes.outputs.any-rust-code-changed == 'true' ||
        needs.detect-changes.outputs.docs-changed == 'true'
      )
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test runtime-independent capture cache
        run: cargo test --locked --no-default-features --features cache --test cache_feature

      - name: Check minimal search feature dependency boundary
        working-directory: .
        run: |
          cargo test --manifest-path rust/Cargo.toml --no-default-features --features search --test search_feature
          node scripts/rust-check-search-feature.mjs

      - name: Check no dependency of ours pulls OpenSSL (issue #151)
        working-directory: .
        run: node scripts/rust-check-openssl-free.mjs

  # Test matrix: Rust on multiple OS - only runs when Rust code changes
  test:
    name: Rust - Test (${{ matrix.os }})
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    needs: [detect-changes]
    if: |
      always() && !cancelled() && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        needs.detect-changes.outputs.any-rust-code-changed == 'true'
      )
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.99.0

      - name: Cache cargo registry
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test --all-features --verbose

      - name: Run doc tests
        run: cargo test --doc --verbose

      - name: Run Google Docs public-document live integration tests (issue #90)
        working-directory: rust
        env:
          GDOCS_INTEGRATION: '1'
        run: cargo test --test integration gdocs_public_doc::live -- --nocapture
        timeout-minutes: 10

      - name: Run Wikipedia page download live integration tests (issue #8)
        working-directory: rust
        env:
          WIKIPEDIA_INTEGRATION: '1'
        run: cargo test --test integration wikipedia_download::live -- --nocapture
        timeout-minutes: 10

      - name: Run GitHub repository capture live integration tests (issue #5)
        working-directory: rust
        env:
          GITHUB_REPOSITORY_INTEGRATION: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo test --test integration github_repository::live -- --nocapture
        timeout-minutes: 10

      - name: Run StackOverflow page download live integration tests (issue #11)
        working-directory: rust
        env:
          STACKOVERFLOW_INTEGRATION: '1'
        run: cargo test --test integration stackoverflow_download::live -- --nocapture --test-threads=1
        timeout-minutes: 10

  # Fresh dependency resolution check (issue #137)
  # The published crate does not ship its Cargo.lock, so consumers resolve every
  # dependency to the newest compatible version. Registry drift in a transitive
  # dependency can therefore break a brand-new `cargo add web-capture` even when
  # the committed lockfile still builds. This job re-resolves from scratch and
  # builds, surfacing that class of breakage before it ships in a release.
  fresh-resolution:
    name: Rust - Fresh Dependency Resolution
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: [detect-changes]
    if: |
      always() && !cancelled() && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        needs.detect-changes.outputs.any-rust-code-changed == 'true'
      )
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.99.0

      - name: Cache cargo registry
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-fresh-resolution
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Re-resolve dependencies from scratch
        run: |
          rm -f Cargo.lock
          cargo generate-lockfile

      - name: Build and test against freshly resolved dependencies
        run: |
          cargo check --all-targets --all-features
          cargo test --all-features

  # Bare-container build check (issue #151)
  # `rust:1.99.0-slim-trixie` ships no `pkg-config` and no OpenSSL headers. Building here
  # without any `apt-get install` step proves the crate does not silently require a
  # system OpenSSL toolchain. The dependency graph guard additionally checks the
  # default runtime; current browser-commander uses rustls for fantoccini.
  bare-container-build:
    name: Rust - Build Without System OpenSSL
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Pinned by digest: a mutable tag is arbitrary code in this job. Re-resolve with
    #   docker buildx imagetools inspect rust:<tag>
    container: rust:1.99.0-slim-trixie@sha256:24e632c09342c20abf8312cf4f61430a911c01ed3a5e4c02b87292b1c39c5273
    needs: [detect-changes]
    if: |
      always() && !cancelled() && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        needs.detect-changes.outputs.any-rust-code-changed == 'true'
      )
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build the minimal search feature set with no system packages
        run: cargo build --no-default-features --features search

  # Build check - only runs when Rust code changes
  build:
    name: Rust - Build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: [lint, test, fresh-resolution]
    if: |
      !cancelled() &&
      needs.lint.result == 'success' &&
      needs.test.result == 'success' &&
      (needs.fresh-resolution.result == 'success' || needs.fresh-resolution.result == 'skipped')
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.99.0

      - name: Cache cargo registry
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release
        run: cargo build --release

      - name: Check package
        run: cargo package --list --allow-dirty

      - name: Build Docker image
        run: docker build -t web-capture-rust .

  # Release - only runs on main after tests pass (for push events)
  # Self-healing: detects unreleased commits and auto-bumps patch version
  release:
    name: Rust - Release
    needs: [lint, test, build, dependency-health]
    if: |
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.lint.result == 'success' &&
      needs.test.result == 'success' &&
      needs.dependency-health.result == 'success' &&
      needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          # This job pushes version commits with the checkout token.
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.node-version'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.99.0

      - name: Cache cargo registry
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup current npm
        run: node ../scripts/setup-npm.mjs

      - name: Install release tooling
        working-directory: .
        run: npm ci

      - name: Check if release is needed
        id: release_check
        run: node ../scripts/rust-check-release-needed.mjs

      - name: Auto-bump patch version for unreleased changes
        if: steps.release_check.outputs.should_release == 'true' && steps.release_check.outputs.needs_auto_bump == 'true'
        id: auto_bump
        # Uses scripts/safe-git-push.mjs for fetch+rebase+retry so concurrent
        # pushes from the JS release workflow don't cause non-fast-forward
        # rejections. See docs/case-studies/issue-94.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node ../scripts/rust-version-bump.mjs --bump-type patch --description "Auto-release unreleased changes"
          git add -A
          NEW_VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          git commit -m "chore(rust): auto-bump to ${NEW_VERSION} for unreleased changes"
          node ../scripts/safe-git-push.mjs --branch main
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Auto-bumped to ${NEW_VERSION}"

      - name: Determine release version
        id: version
        env:
          AUTO_BUMP_VERSION: ${{ steps.auto_bump.outputs.version }}
          CHECKED_VERSION: ${{ steps.release_check.outputs.version }}
        run: echo "version=${AUTO_BUMP_VERSION:-$CHECKED_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build release
        if: steps.release_check.outputs.should_release == 'true'
        run: cargo build --release

      - name: Publish to crates.io
        if: steps.release_check.outputs.should_release == 'true'
        id: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || secrets.CARGO_TOKEN }}
          CARGO_TOKEN: ${{ secrets.CARGO_TOKEN }}
        run: node ../scripts/rust-publish-crate.mjs

      - name: Create GitHub Release
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: node ../scripts/rust-create-github-release.mjs --release-version "$RELEASE_VERSION" --repository "$GITHUB_REPOSITORY" --commit-sha "$GITHUB_SHA"

  # Manual Instant Release
  instant-release:
    name: Rust - Instant Release
    needs: [lint, test, build, dependency-health]
    if: |
      !cancelled() &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.release_mode == 'instant' &&
      needs.lint.result == 'success' &&
      needs.test.result == 'success' &&
      needs.dependency-health.result == 'success' &&
      needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          # This job pushes version commits with the checkout token.
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.node-version'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.99.0

      - name: Cache cargo registry
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup current npm
        run: node ../scripts/setup-npm.mjs

      - name: Install release tooling
        working-directory: .
        run: npm ci

      - name: Version and commit
        id: version
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          RELEASE_DESCRIPTION: ${{ github.event.inputs.description }}
        run: node ../scripts/rust-version-and-commit.mjs --bump-type "$BUMP_TYPE" --description "$RELEASE_DESCRIPTION"

      - name: Publish to crates.io
        if: steps.version.outputs.version_committed == 'true'
        id: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || secrets.CARGO_TOKEN }}
          CARGO_TOKEN: ${{ secrets.CARGO_TOKEN }}
        run: node ../scripts/rust-publish-crate.mjs

      - name: Create GitHub Release
        if: steps.version.outputs.version_committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_DESCRIPTION: ${{ github.event.inputs.description }}
        run: node ../scripts/rust-create-github-release.mjs --release-version "$RELEASE_VERSION" --repository "$GITHUB_REPOSITORY" --description "$RELEASE_DESCRIPTION" --commit-sha "$GITHUB_SHA"

  # Manual Changelog PR - creates a PR with version bump for review before release
  changelog-pr:
    name: Rust - Create Changelog PR
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode == 'changelog-pr'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.node-version'

      - name: Setup current npm
        run: node ../scripts/setup-npm.mjs

      - name: Install release tooling
        working-directory: .
        run: npm ci

      - name: Bump version in Cargo.toml and CHANGELOG.md
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          RELEASE_DESCRIPTION: ${{ github.event.inputs.description }}
        run: node ../scripts/rust-version-bump.mjs --bump-type "$BUMP_TYPE" --description "$RELEASE_DESCRIPTION"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(rust): bump version (${{ github.event.inputs.bump_type }})'
          branch: changelog-rust-manual-release-${{ github.run_id }}
          delete-branch: true
          title: 'chore(rust): manual ${{ github.event.inputs.bump_type }} release'
          body: |
            ## Manual Release Request (Rust)

            This PR was created by a manual workflow trigger to prepare a **${{ github.event.inputs.bump_type }}** release.

            ### Release Details
            - **Type:** ${{ github.event.inputs.bump_type }}
            - **Description:** ${{ github.event.inputs.description || 'Manual release' }}
            - **Triggered by:** @${{ github.actor }}

            ### Next Steps
            1. Review the version bump and changelog in this PR
            2. Merge this PR to main
            3. The automated release workflow will publish to crates.io and create a GitHub release
