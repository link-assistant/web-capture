version: 2
# A 7-day cooldown lets the registries yank compromised or broken releases
# before Dependabot proposes them (zizmor dependabot-cooldown).
updates:
  - package-ecosystem: npm
    directories: ['/', '/js']
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-dependencies:
        patterns: ['*']
    # Every js/package.json `dependencyBlockers` entry must be ignored here,
    # otherwise Dependabot reopens the blocked upgrade (PR #176 merged
    # browser-commander 0.22.0 past open blocker #160). Enforced by
    # scripts/check-dependency-freshness.mjs.
    ignore:
      - dependency-name: 'browser-commander'
  - package-ecosystem: cargo
    directories: ['/rust', '/experiments/issue-158/fresh-consumer']
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo-dependencies:
        patterns: ['*']
  # uv.lock is the source of truth; requirements.txt is its `uv export`.
  # The `uv` ecosystem keeps uv.lock in sync, which `pip` cannot.
  - package-ecosystem: uv
    directory: '/'
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python-dependencies:
        patterns: ['*']
  - package-ecosystem: docker
    directories: ['/js', '/rust']
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker-images:
        patterns: ['*']
  - package-ecosystem: docker-compose
    directory: '/js'
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
