version: 2
updates:
  - package-ecosystem: npm
    directories: ['/', '/js']
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ['*']
  - package-ecosystem: cargo
    directories: ['/rust', '/experiments/issue-158/fresh-consumer']
    schedule:
      interval: weekly
    groups:
      cargo-dependencies:
        patterns: ['*']
  - package-ecosystem: pip
    directory: '/'
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ['*']
  - package-ecosystem: docker
    directories: ['/js', '/rust']
    schedule:
      interval: weekly
    groups:
      docker-images:
        patterns: ['*']
  - package-ecosystem: docker-compose
    directory: '/js'
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
